apiVersion: apps/v1
kind: Deployment

metadata:
  name: employee-app
  namespace: employee

spec:
  replicas: 2

  selector:
    matchLabels:
      app: employee-app

  template:
    metadata:
      labels:
        app: employee-app

    spec:
      containers:
      - name: employee-app
        image: docker.io/library/employee-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
